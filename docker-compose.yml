services:
  casefile:
    build: .
    image: casefile:latest
    container_name: casefile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./data:/app/data
      - ./rules:/app/rules
      - ./knowledge:/app/knowledge
      - ./scripts:/app/scripts
      - ./docs:/app/docs
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app/backend

  api:
    extends:
      service: casefile
