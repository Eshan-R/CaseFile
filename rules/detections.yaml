# EDR & Host Log Rules (do not apply to firewall_kv; skipped to avoid IPS noise)
- id: account-discovery
  name: "Account Discovery Activity"
  description: "Enumeration of local accounts, domain users, or password file reconnaissance."
  type: match
  technique:
    id: T1087
    name: "Account Discovery"
  tactic: discovery
  kill_chain_stage: "Discovery"
  severity: low
  confidence: 0.70
  applies_to:
    - windows_event
    - edr
  where:
    or:
      - field: attack
        op: contains
        value: "Password.Files.Access"
      - field: attack
        op: contains
        value: "User.Enumeration"
      - field: cmd
        op: contains
        value: "net user"
      - field: cmd
        op: contains
        value: "getent passwd"

- id: credential-dumping-indicators
  name: "OS Credential Dumping Indicators"
  description: "Memory dumping of lsass process or access to password and shadow files."
  type: match
  technique:
    id: T1003.001
    name: "OS Credential Dumping: LSASS Memory"
  tactic: credential_access
  kill_chain_stage: "Credential Access"
  severity: critical
  confidence: 0.90
  applies_to:
    - windows_event
    - edr
  where:
    or:
      - field: attack
        op: contains
        value: "Mimikatz"
      - field: attack
        op: contains
        value: "Password.Files"
      - field: cmd
        op: contains
        value: "lsass"
      - field: cmd
        op: contains
        value: "procdump"

- id: malware-detection
  name: "Malware Detection"
  description: "Malicious payload detected by security gateway."
  type: match
  technique:
    id: T1204.002
    name: "User Execution: Malicious File"
  tactic: execution
  kill_chain_stage: "Execution"
  severity: high
  confidence: 0.85
  applies_to:
    - windows_event
    - edr
  where:
    virus:
      op: contains
      value: "JS/Nemucod"

# Retired Legacy Rules (disabled; superseded by comprehensive SQL v2 rules)
- id: large-outbound-transfer
  name: "Large Outbound Data Transfer"
  description: "Exfiltration or large file upload exceeding threshold."
  type: match
  technique:
    id: T1048.002
    name: "Exfiltration Over Asymmetric Protocol"
  tactic: exfiltration
  kill_chain_stage: "Exfiltration"
  severity: high
  confidence: 0.85
  enabled: false
  superseded_by: staged-exfil
  applies_to:
    - firewall_kv
  where:
    sentbyte:
      op: gt
      value: 8999999

- id: targeted-web-attack
  name: "Targeted Web Application Attack"
  description: "Web exploits including SQL injection."
  type: match
  technique:
    id: T1190
    name: "Exploit Public-Facing Application"
  tactic: initial_access
  kill_chain_stage: "Exploitation"
  severity: high
  confidence: 0.85
  enabled: false
  superseded_by: "web-payload-sqli, web-payload-xss, web-payload-cmdi, web-payload-traversal"
  applies_to:
    - firewall_kv
  where:
    attack:
      op: contains
      value: "HTTP.URI.SQL.Injection"

- id: dns-tunneling
  name: "DNS Tunneling Query"
  description: "Suspicious DNS query pattern associated with tunneling."
  type: match
  technique:
    id: T1071.004
    name: "DNS"
  tactic: command_and_control
  kill_chain_stage: "Command and Control"
  severity: high
