# CaseFile Production Detection Rules
# Stored in rules/ and loaded dynamically by rule_loader.py

- id: failed-admin-burst
  name: "Failed Admin Authentication Burst"
  description: "High-velocity password guessing attacks against administrative interfaces (>= 500 failures in 10 minutes)."
  type: sql
  sql_file: rules/sql/failed_admin_burst.sql
  technique:
    id: T1110.001
    name: "Password Spraying / Brute Force"
  tactic: credential_access
  kill_chain_stage: "Exploitation"
  severity: high
  confidence: 0.90
  high_fidelity: true
  applies_to:
    - firewall_kv

