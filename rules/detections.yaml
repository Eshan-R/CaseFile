- id: remote-logon-between-hosts
  name: "Remote Logon Between Internal Hosts"
  description: "Lateral movement via RDP or remote logon."
  type: match
  technique:
    id: T1021.001
    name: "Remote Desktop Protocol"
  tactic: lateral_movement
  kill_chain_stage: "Lateral Movement"
  severity: medium
  confidence: 0.80
  enabled: false
  superseded_by: lateral-fanout
  applies_to:
    - firewall_kv
  where:
    dst_port:
      op: eq
      value: 3389

- id: valid-account-misuse
  name: "Valid Account External Logon"
  description: "Authentication via external or administrative credentials."
  type: match
  technique:
    id: T1078.001
    name: "Default / Administrative Accounts"
  tactic: initial_access
  kill_chain_stage: "Initial Access"
  severity: medium
  confidence: 0.80
  enabled: false
  superseded_by: "admin-login-external, login-success-after-failures"
  applies_to:
    - firewall_kv
  where:
    and:
      - field: action
        op: eq
        value: "login"
      - field: status
        op: eq
        value: "success"

- id: brute-force-failed-logins
  name: "High-Velocity Authentication Failures"
  description: "High-velocity password guessing attacks (>= 500 failures in 10 minutes)."
  type: threshold
  technique:
    id: T1110.001
    name: "Password Spraying / Brute Force"
  tactic: credential_access
  kill_chain_stage: "Exploitation"
  severity: high
  confidence: 0.90
  enabled: false
  superseded_by: failed-admin-burst
  applies_to:
    - firewall_kv
  group_by:
    - src_ip
  window_seconds: 600
  min_count: 500
  where:
    and:
      - field: action
        op: eq
        value: "login"
      - field: outcome
        op: eq
        value: "failure"
